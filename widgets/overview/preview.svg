<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Heat pump overview preview</title>
  <style>
    .unit { fill: var(--box); stroke: var(--line); stroke-width: 14; }
    .hot { fill: none; stroke: #e5484d; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
    .cold { fill: none; stroke: #3b82f6; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect class="unit" x="60" y="300" width="300" height="300" rx="40" />
  <circle cx="210" cy="450" r="95" fill="none" stroke="var(--line)" stroke-width="14" />
  <g transform="translate(210 450) scale(1.6)" fill="var(--line)">
    <path id="blade" d="M0 0C-14-12-17-38-5-48C5-51 15-43 12-29C9-17 5-9 0 0Z" />
    <use href="#blade" transform="rotate(120)" />
    <use href="#blade" transform="rotate(240)" />
    <circle r="8" />
  </g>
  <path class="hot" d="M360 380H520V250H900V380" />
  <path class="cold" d="M360 520H520V800H900V640" />
  <rect x="560" y="330" width="170" height="380" rx="70" fill="#f7c9c9" stroke="var(--line)" stroke-width="14" />
  <rect x="790" y="380" width="170" height="260" rx="60" fill="#cfe0fb" stroke="var(--line)" stroke-width="14" />
  <path class="hot" stroke-width="20" d="M600 420l90 30-90 30" />
  <path class="cold" stroke-width="20" d="M600 540l90 30-90 30" />
</svg>
