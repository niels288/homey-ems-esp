    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5ec"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <circle cx="820" cy="120" r="260" fill="#fff" opacity=".06"/>
  <circle cx="150" cy="640" r="220" fill="#fff" opacity=".05"/>
